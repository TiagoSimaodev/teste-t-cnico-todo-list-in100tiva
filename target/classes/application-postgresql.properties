# ============================================
# Perfil: POSTGRESQL (Local ou RDS)
# ============================================
# Para usar este perfil em desenvolvimento com PostgreSQL local:
# mvn spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=postgresql"

spring.application.name=to-do-list-100tiva

# ============================================
# BANCO DE DADOS - PostgreSQL
# ============================================
# Para PostgreSQL local (padrão):
spring.datasource.url=jdbc:postgresql://localhost:5432/todolist_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Para AWS RDS (descomente e configure):
# spring.datasource.url=jdbc:postgresql://seu-instance.xxxxx.us-east-1.rds.amazonaws.com:5432/todolist_db
# spring.datasource.username=admin
# spring.datasource.password=SuaSenhaAqui123!

# ============================================
# CONFIGURAÇÕES JPA/HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CONFIGURAÇÕES DE LOG
# ============================================
logging.level.com.todolist=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CONFIGURAÇÕES DO SERVER
# ============================================
server.port=8080
server.servlet.context-path=/api