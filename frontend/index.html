<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List 100tiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>To-Do List 100tiva</h1>
            <p>Gerencie suas tarefas de forma simples e eficiente</p>
        </header>

        <form id="taskForm" class="task-form">
            <div class="form-group">
                <input type="text" id="title" placeholder="Título da tarefa" required>
            </div>
            <div class="form-group">
                <textarea id="description" placeholder="Descrição (opcional)" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Adicionar Tarefa</button>
        </form>

        <div id="loading" class="loading">Carregando tarefas...</div>

        <div id="taskList" class="task-list">
            <!-- Tarefas serão inseridas aqui dinamicamente -->
        </div>

        <div id="emptyState" class="empty-state">
            <p>Nenhuma tarefa encontrada. Adicione sua primeira tarefa acima!</p>
        </div>
    </div>

    <!-- Modal para editar tarefa -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Editar Tarefa</h2>
            <form id="editForm" class="task-form">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <input type="text" id="editTitle" placeholder="Título da tarefa" required>
                </div>
                <div class="form-group">
                    <textarea id="editDescription" placeholder="Descrição (opcional)" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="editCompleted">
                        Concluída
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
