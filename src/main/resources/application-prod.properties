# ============================================
# Perfil: PRODUCTION (PostgreSQL + AWS RDS)
# ============================================
# Para usar este perfil, execute:
# mvn spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=prod"
# OU adicione em application.properties: spring.profiles.active=prod

# Configurações do Spring Boot
spring.application.name=to-do-list-100tiva

# ============================================
# BANCO DE DADOS - PostgreSQL (AWS RDS)
# ============================================
# URL do banco PostgreSQL
# Exemplo para AWS RDS:
# jdbc:postgresql://seu-instance.c9akciq32.us-east-1.rds.amazonaws.com:5432/todolistdb
spring.datasource.url=jdbc:postgresql://localhost:5432/todolistdb
spring.datasource.username=postgres
spring.datasource.password=seu_senha_aqui
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURAÇÕES JPA/HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de Conexões (HikariCP - padrão do Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============================================
# CONFIGURAÇÕES DE LOG
# ============================================
logging.level.com.todolist=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# ============================================
# CONFIGURAÇÕES DO SERVER
# ============================================
server.port=8080
server.servlet.context-path=/api

# Configurações de performance
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.compression.enabled=true
server.compression.min-response-size=1024